name: VEIL Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veil-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check VEIL ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VEIL_OUTPUT_DIR: ${{ github.workspace }}/apk-output

    steps:
      - name: Select source cache
        run: echo "VEIL_FIREFOX_DIR=$RUNNER_TEMP/repos/veil-firefox" >> "$GITHUB_ENV"

      - name: Checkout VEIL source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'

      - name: Install required Android SDK packages and link cmdline-tools
        run: |
          sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            cd "$SDK_ROOT/cmdline-tools"
            echo "Current cmdline-tools:"
            ls -la
            FIRST_TOOL=$(ls -1 | grep -v '23.0' | head -n 1)
            if [ -n "$FIRST_TOOL" ] && [ ! -e "23.0" ]; then
              sudo ln -s "$FIRST_TOOL" 23.0 || ln -s "$FIRST_TOOL" 23.0
            fi
            if [ -n "$FIRST_TOOL" ] && [ ! -e "latest" ]; then
              sudo ln -s "$FIRST_TOOL" latest || ln -s "$FIRST_TOOL" latest
            fi
            echo "Updated cmdline-tools:"
            ls -la
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build VEIL from pinned Firefox source
        run: bash browser/build.sh --setup

      - name: Run build-tool tests, affected Android tests and lint
        run: bash browser/check.sh

      - name: Attach source identity
        run: |
          git rev-parse HEAD > apk-output/VEIL_SOURCE_COMMIT.txt
          cp browser/upstream.json apk-output/FIREFOX_SOURCE.json

      - name: Create GitHub Release with APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.0-build-${{ github.run_number }}"
          gh release create "$TAG" apk-output/*             --title "VEIL 0.2.0 (Build #${{ github.run_number }})"             --notes "Automatischer APK Build aus Commit ${{ github.sha }}"             --target "${{ github.sha }}" || true

      - name: Upload verified debug APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VEIL-arm64-debug-${{ github.run_number }}-${{ github.sha }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repos/veil-firefox/artifacts/*.log
            ${{ runner.temp }}/repos/veil-firefox/objdir-frontend/gradle/build/mobile/android/fenix/app/reports/
          if-no-files-found: ignore
          retention-days: 14
