name: VEIL Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veil-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and verify VEIL ARM64 release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VEIL_OUTPUT_DIR: ${{ github.workspace }}/apk-output
      VEIL_VARIANT: release
      ANDROID_BUILD_TOOLS: '37.0.0'

    steps:
      - name: Select source cache
        run: echo "VEIL_FIREFOX_DIR=$RUNNER_TEMP/repos/veil-firefox" >> "$GITHUB_ENV"

      - name: Checkout VEIL source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches the app version
        run: |
          version="$(python3 -c "import sys; sys.path.insert(0, 'browser'); import export_apk; print(export_apk.VERSION)")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version (expected v$version)." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-37.2' "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Run build-tool tests
        run: python3 -m unittest discover -s browser/tests -v

      - name: Build unsigned VEIL release APK from pinned Firefox source
        run: bash browser/build.sh --setup

      - name: Sign, align and verify
        env:
          VEIL_KEYSTORE_BASE64: ${{ secrets.VEIL_KEYSTORE_BASE64 }}
          VEIL_KEYSTORE_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
          VEIL_KEY_ALIAS: ${{ secrets.VEIL_KEY_ALIAS }}
          VEIL_KEY_PASSWORD: ${{ secrets.VEIL_KEY_PASSWORD }}
        run: |
          for name in VEIL_KEYSTORE_BASE64 VEIL_KEYSTORE_PASSWORD VEIL_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Repository secret ${name} is not set; see README (Release signing)." >&2
              exit 1
            fi
          done
          export VEIL_KEYSTORE="$RUNNER_TEMP/veil-release.jks"
          trap 'rm -f "$VEIL_KEYSTORE"' EXIT
          printf '%s' "$VEIL_KEYSTORE_BASE64" | base64 --decode > "$VEIL_KEYSTORE"
          unsigned=("$VEIL_OUTPUT_DIR"/VEIL-*-arm64-release-unsigned.apk)
          python3 browser/sign_apk.py "${unsigned[0]}" "$VEIL_OUTPUT_DIR/signed"

      - name: Attach source identity
        run: |
          git rev-parse HEAD > apk-output/signed/VEIL_SOURCE_COMMIT.txt
          cp browser/upstream.json apk-output/signed/FIREFOX_SOURCE.json

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-arm64-release-${{ github.run_number }}-${{ github.sha }}
          path: apk-output/signed/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-release-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/repos/veil-firefox/artifacts/*.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          pattern: VEIL-arm64-release-*
          merge-multiple: true
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "VEIL ${GITHUB_REF_NAME#v}" \
            --notes "Signed ARM64 release APK (Android 8.0+). Verify with the attached .sha256 files; signing certificate digest is in the .cert-sha256 file. Built from pinned Firefox source (FIREFOX_SOURCE.json)."
