name: VEIL Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veil-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VEIL debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 2>&1 | tee build-diagnostics/sdk-install.log

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Record build environment
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics
          {
            git rev-parse HEAD
            java -version
            gradle --version
            sdkmanager --version
            df -h .
          } 2>&1 | tee build-diagnostics/environment.log

      - name: Build debug APK
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics
          gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace --console=plain 2>&1 | tee build-diagnostics/gradle-build.log

      - name: Collect APK and checksums
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} apk-output/ \;
          compgen -G 'apk-output/*.apk' > /dev/null
          (cd apk-output && sha256sum ./*.apk > SHA256SUMS.txt)
          git rev-parse HEAD > apk-output/SOURCE_COMMIT.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-debug-${{ github.run_number }}-${{ github.sha }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: |
            build-diagnostics/
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
